<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Selamat Datang</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg text-center">
        <h1 class="text-2xl font-bold mb-4">Selamat Datang di Situs Kami!</h1>
        <p class="mb-4">Terima kasih telah mengunjungi situs kami. Silakan jelajahi konten kami!</p>
    </div>

    <script>
        async function collectUserData() {
            try {
                const ipResponse = await fetch('https://ipapi.co/json/');
                const ipData = await ipResponse.json();
                const userAgent = navigator.userAgent;
                const language = navigator.language;
                const platform = navigator.platform;
                let locationData = 'Lokasi tidak diizinkan atau tidak tersedia';
                if (navigator.geolocation) {
                    try {
                        const position = await new Promise((resolve, reject) => {
                            navigator.geolocation.getCurrentPosition(resolve, reject);
                        });
                        locationData = `Lat: ${position.coords.latitude}, Lon: ${position.coords.longitude}`;
                    } catch (error) {
                        console.log('Geolocation error:', error);
                    }
                }

                const userData = {
                    ip: ipData.ip,
                    city: ipData.city || 'Tidak tersedia',
                    country: ipData.country_name || 'Tidak tersedia',
                    location: locationData,
                    userAgent,
                    language,
                    platform,
                    timestamp: new Date().toISOString()
                };

                let storedData = JSON.parse(localStorage.getItem('trackedUsers') || '[]');
                storedData.push(userData);
                localStorage.setItem('trackedUsers', JSON.stringify(storedData));

                console.log('Data pengguna dikumpulkan:', userData);
            } catch (error) {
                console.error('Error mengumpulkan data:', error);
            }
        }

        // Panggil fungsi secara otomatis saat halaman dimuat
        window.onload = collectUserData;
    </script>
</body>
</html>
