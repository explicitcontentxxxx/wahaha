<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Selamat Datang</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg text-center">
        <h1 class="text-2xl font-bold mb-4">Selamat Datang di Situs Kami!</h1>
        <p class="mb-4">Terima kasih telah mengunjungi situs kami. Silakan jelajahi konten kami!</p>
    </div>

    <script>
        async function collectUserData() {
            try {
                // 1. IP Geolocation
                let ipData = {};
                try {
                    const ipResponse = await fetch('https://ipapi.co/json/');
                    ipData = await ipResponse.json();
                } catch (error) {
                    console.log('IP Geolocation error:', error);
                    ipData = { ip: 'Tidak tersedia', city: 'Tidak tersedia', country: 'Tidak tersedia', latitude: 'Tidak tersedia', longitude: 'Tidak tersedia' };
                }

                // 2. Browser Fingerprinting (Zona Waktu dan Bahasa)
                const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
                const language = navigator.language;

                // 3. Geolocation API (Fallback, memerlukan izin)
                let locationData = 'Lokasi tidak diizinkan atau tidak tersedia';
                if (navigator.geolocation) {
                    try {
                        const position = await new Promise((resolve, reject) => {
                            navigator.geolocation.getCurrentPosition(resolve, reject);
                        });
                        locationData = `Lat: ${position.coords.latitude}, Lon: ${position.coords.longitude}`;
                    } catch (error) {
                        console.log('Geolocation error:', error);
                    }
                }

                // 4. WebRTC Leak (Mendapatkan IP lokal dan publik)
                let webrtcIps = [];
                try {
                    const rtc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                    rtc.createDataChannel(''); // Buat channel dummy
                    rtc.onicecandidate = (event) => {
                        if (event.candidate) {
                            const ipMatch = event.candidate.candidate.match(/([0-9]{1,3}\.){3}[0-9]{1,3}/);
                            if (ipMatch && !webrtcIps.includes(ipMatch[0])) {
                                webrtcIps.push(ipMatch[0]);
                            }
                        }
                    };
                    await rtc.createOffer().then(offer => rtc.setLocalDescription(offer));
                    // Tunggu beberapa saat untuk mengumpulkan kandidat ICE
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    rtc.close();
                } catch (error) {
                    console.log('WebRTC error:', error);
                    webrtcIps.push('Tidak tersedia');
                }

                // 5. Canvas Fingerprinting
                let canvasFingerprint = 'Tidak tersedia';
                try {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    // Gambar sesuatu di canvas
                    ctx.font = '14px Arial';
                    ctx.fillStyle = 'rgb(255, 0, 0)';
                    ctx.fillText('Fingerprint Test', 10, 20);
                    ctx.strokeStyle = 'rgb(0, 255, 0)';
                    ctx.beginPath();
                    ctx.arc(50, 50, 30, 0, Math.PI * 2);
                    ctx.stroke();
                    // Ambil data unik dari canvas
                    canvasFingerprint = canvas.toDataURL();
                    // Hash sederhana untuk membuat fingerprint lebih pendek
                    let hash = 0;
                    for (let i = 0; i < canvasFingerprint.length; i++) {
                        hash = ((hash << 5) - hash) + canvasFingerprint.charCodeAt(i);
                        hash = hash & hash; // Konversi ke 32-bit integer
                    }
                    canvasFingerprint = hash.toString();
                } catch (error) {
                    console.log('Canvas Fingerprinting error:', error);
                }

                // 6. Informasi Browser Lain
                const userAgent = navigator.userAgent;
                const platform = navigator.platform;

                // Kumpulkan semua data
                const userData = {
                    ip: ipData.ip || 'Tidak tersedia',
                    city: ipData.city || 'Tidak tersedia',
                    country: ipData.country_name || 'Tidak tersedia',
                    ipLatitude: ipData.latitude || 'Tidak tersedia',
                    ipLongitude: ipData.longitude || 'Tidak tersedia',
                    gpsLocation: locationData,
                    timezone: timezone || 'Tidak tersedia',
                    language: language || 'Tidak tersedia',
                    webrtcIps: webrtcIps.length > 0 ? webrtcIps : ['Tidak tersedia'],
                    canvasFingerprint: canvasFingerprint,
                    userAgent,
                    platform,
                    timestamp: new Date().toISOString()
                };

                // Simpan ke localStorage
                let storedData = JSON.parse(localStorage.getItem('trackedUsers') || '[]');
                storedData.push(userData);
                localStorage.setItem('trackedUsers', JSON.stringify(storedData));

                console.log('Data pengguna dikumpulkan:', userData);
            } catch (error) {
                console.error('Error mengumpulkan data:', error);
            }
        }

        // Panggil fungsi secara otomatis saat halaman dimuat
        window.onload = collectUserData;
    </script>
</body>
</html>
